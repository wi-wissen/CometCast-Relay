# SPDX-License-Identifier: GPL-3.0-or-later
#
# OPTIONAL profile, NOT the public relay: an INTERNAL-mode cometcast-server with coturn (TURN) for an
# organisation that wants calls across networks. Derived by hand from deploy/docker-compose.yml of the
# product repository (the reference copy is internal/upstream/docker-compose.yml, commit in
# internal/PRODUCT_COMMIT); differences: the image comes from ghcr.io by exact version instead of a
# local build, and the paths are relative to internal/. Read internal/README.md first.
#
# Status: `docker compose config` is checked in CI. The stack this file is derived from ran once in
# the product repository (docs/server.md "First real run"); THIS file was only validated, not run on a
# real network. UNCERTAIN: two real devices through TURN, NAT, TLS on 5349, IPv6, a real certificate.
#
# Run from THIS folder (internal/). The UIDs matter: the server image runs as 65532, the coturn image as
# nobody (65534); neither runs as root. Steps (details in README.md):
#   1. cp .env.example .env ; cp config/server.example.toml config/server.toml   (edit both)
#   2. mkdir -p secrets certs ; openssl rand -hex 32 > secrets/turn_secret ; openssl rand -hex 32 > secrets/altcha_secret
#      sudo chown root:65532 secrets/* ; sudo chmod 640 secrets/*
#   3. certs/fullchain.pem and certs/privkey.pem ; sudo chown 65532:65534 certs/privkey.pem ; sudo chmod 640 certs/privkey.pem
#   4. sudo TURN_CONF_GROUP=65534 ./coturn/render.sh
#   5. docker compose up -d

name: cometcast-internal

services:
  cometcast-server:
    image: ghcr.io/wi-wissen/cometcast-server:${COMETCAST_VERSION:?set COMETCAST_VERSION in .env}
    restart: unless-stopped
    ports:
      # Change the left side to "127.0.0.1:8443:8443" if a reverse proxy on this host is the only client.
      - "8443:8443"
    volumes:
      - ./config/server.toml:/etc/cometcast/server.toml:ro
      - ./certs:/etc/cometcast/certs:ro
    secrets:
      - turn_secret
      - altcha_secret
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # UNCERTAIN: untuned placeholders, as in the product repository.
    mem_limit: 512m
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  coturn:
    # Tested tag: 4.18.0 (run on 2026-11-07 in the product repository). Set COTURN_VERSION in .env.
    image: coturn/coturn:${COTURN_VERSION:?set COTURN_VERSION in .env}
    restart: unless-stopped
    # A whole range of UDP ports is used for relaying; host networking avoids mapping them. Linux only.
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./certs:/etc/coturn/certs:ro
    # The turnserver binary carries a file capability; without NET_BIND_SERVICE it cannot start.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 512
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-p", "3478", "${TURN_LISTENING_IP:-127.0.0.1}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  turn_secret:
    file: ./secrets/turn_secret
  altcha_secret:
    file: ./secrets/altcha_secret
