# SPDX-License-Identifier: GPL-3.0-or-later
#
# coturn as a STUN-ONLY server for the public relay (compose.yaml, service "stun").
# It answers STUN Binding requests ("what is my public address and port?") and nothing else:
# no TURN allocations, no relaying, no authentication, no accounts, no secrets in this file.
# Tested against coturn 4.18.0 (the tag pinned in compose.yaml); options of other versions can differ
# (an unknown option is a startup error, never silently ignored: check `docker compose logs stun`).
# See docs/SETUP.md "STUN service" for the threat model (reflection/amplification) and the tests.

# --- no TURN at all ---
# stun-only: coturn ignores every TURN request (Allocate etc.). no-tcp-relay on top: even if that
# were ever bypassed there is no TCP relay. (no-udp-relay together with no-tcp-relay is refused by
# coturn at start: "cannot be used together". No users, no secret and no realm are configured
# either, so a TURN request has no credentials to authenticate with.)
stun-only
no-tcp-relay

# --- listeners: UDP 3478 only ---
# Browsers gather their public address with STUN over UDP. TCP and TLS listeners are not needed
# for that and are switched off (DTLS is off by default in 4.18; `no-dtls` is not an option there).
listening-port=3478
no-tcp
no-tls

# --- smaller, plain answers (less to reflect) ---
# A Binding answer then holds only the 20 byte header and XOR-MAPPED-ADDRESS. In 4.18 these are
# the defaults already (RFC 5780 attributes, the RFC 3489 legacy MAPPED-ADDRESS and SOFTWARE are
# opt-in); they are written down so that a change of defaults in a newer coturn does not widen
# the answer unnoticed (docs/SETUP.md "STUN service"; scripts/stun-check.py prints the size).
no-rfc5780
no-software-attribute

# --- container details ---
# Read-only root file system: the pid file goes to the tmpfs, the log to standard output.
pidfile=/tmp/turnserver.pid
log-file=stdout
simple-log
